name: Center mobile trailer base

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Center mobile trailer base'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Center and shorten mobile trailer base
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '.screen-box:before{left:-4px;right:-14px;bottom:-10px;height:12px;border-top:1.5px solid #1a2024;background:radial-gradient(circle at 36% 7px,#f7f7f5 0 2.5px,#1a2024 3px 5.5px,transparent 6px),radial-gradient(circle at 52% 7px,#f7f7f5 0 2.5px,#1a2024 3px 5.5px,transparent 6px)}'
          new = '.screen-box:before{left:-6px;right:-6px;bottom:-10px;height:12px;border-top:1.25px solid #252b2f;background:radial-gradient(circle at 36% 7px,#f7f7f5 0 2.5px,#252b2f 3px 5.5px,transparent 6px),radial-gradient(circle at 52% 7px,#f7f7f5 0 2.5px,#252b2f 3px 5.5px,transparent 6px)}'
          if old not in s:
              raise SystemExit('Current mobile trailer base override not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Center mobile trailer base styling"
          git push
