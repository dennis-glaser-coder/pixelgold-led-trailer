name: Mobile animation updater

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.event.head_commit.message == 'Add temporary mobile animation updater'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine mobile animations
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          a='.nav{display:none;position:absolute;top:76px;left:0;right:0;z-index:35;background:#080b0d;padding:22px max(18px,env(safe-area-inset-right)) 28px max(18px,env(safe-area-inset-left));flex-direction:column;align-items:stretch;border-top:1px solid rgba(255,255,255,.15);box-shadow:0 14px 30px rgba(0,0,0,.22)}.nav.open{display:flex}'
          b='.nav{display:flex;position:absolute;top:76px;left:0;right:0;z-index:35;background:#080b0d;padding:22px max(18px,env(safe-area-inset-right)) 28px max(18px,env(safe-area-inset-left));flex-direction:column;align-items:stretch;border-top:1px solid rgba(255,255,255,.15);box-shadow:0 14px 30px rgba(0,0,0,.22);opacity:0;visibility:hidden;transform:translateY(-14px);pointer-events:none;transition:opacity .3s ease,transform .38s cubic-bezier(.22,1,.36,1),visibility 0s linear .38s}.nav.open{opacity:1;visibility:visible;transform:translateY(0);pointer-events:auto;transition-delay:0s}'
          c='.mobile-cta{display:flex;position:fixed;left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));z-index:40;box-shadow:0 8px 24px rgba(0,0,0,.28);opacity:0;visibility:hidden;transform:translateY(14px);pointer-events:none;transition:opacity .22s ease,transform .22s ease,visibility .22s ease;will-change:opacity,transform}.mobile-cta.is-visible{opacity:1;visibility:visible;transform:translateY(0);pointer-events:auto}'
          d='.mobile-cta{display:flex;position:fixed;left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));z-index:40;box-shadow:0 8px 24px rgba(0,0,0,.28);opacity:0;visibility:hidden;transform:translateY(30px);pointer-events:none;transition:opacity .3s ease,transform .4s cubic-bezier(.22,1,.36,1),visibility 0s linear .4s;will-change:opacity,transform}.mobile-cta.is-visible{opacity:1;visibility:visible;transform:translateY(0);pointer-events:auto;transition-delay:0s}'
          e='@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.button,.product-summary,.chevron,.product-details,.product-detail-content,.whatsapp-button,.use-card,.use-card:before,.use-icon,.mobile-cta{transition:none}}'
          f='@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.button,.product-summary,.chevron,.product-details,.product-detail-content,.whatsapp-button,.use-card,.use-card:before,.use-icon,.mobile-cta,.nav{transition:none}}'
          for old,new in ((a,b),(c,d),(e,f)):
              if old not in s: raise SystemExit('expected marker missing')
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name dennis-glaser-coder
          git config user.email dennis-glaser@gmx.de
          git add index.html
          git commit -m 'Make mobile animations more visible'
          git push
