name: Fix all LED screen proportions

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-all-screen-scale.yml'

permissions:
  contents: write

jobs:
  fix-scale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Scale every LED screen from its real image dimensions
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          s = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '.screen-stage{width:270px;height:170px;',
                  '.screen-stage{width:290px;height:180px;'
              ),
              (
                  '.v7{width:106px;aspect-ratio:1.75}.v11{width:128px;aspect-ratio:1.8}.v15{width:148px;aspect-ratio:1.66}.v21{width:174px;aspect-ratio:1.71}.v28{width:190px;aspect-ratio:1.75}.v91{width:206px;aspect-ratio:13/7}.v117{width:206px;aspect-ratio:13/9}.v144{width:254px;aspect-ratio:16/9}',
                  '.v7{width:56px;height:32px}.v11{width:72px;height:40px}.v15{width:80px;height:48px}.v21{width:96px;height:56px}.v28{width:112px;height:64px}.v91{width:208px;height:112px}.v117{width:208px;height:144px}.v144{width:256px;height:144px}.v7 .screen-label strong{font-size:10px}.v7 .screen-label small{font-size:7px;margin-top:2px}.v11 .screen-label strong{font-size:11px}.v11 .screen-label small{font-size:7px;margin-top:2px}.v15 .screen-label strong{font-size:12px}.v15 .screen-label small{font-size:8px;margin-top:2px}.v21 .screen-label strong{font-size:13px}.v21 .screen-label small{font-size:8px;margin-top:2px}.v28 .screen-label strong{font-size:14px}.v28 .screen-label small{font-size:9px;margin-top:3px}'
              ),
              (
                  '.screen-stage{width:220px}.screen-box.v91,.screen-box.v117{max-width:176px}.screen-box.v144{max-width:217px}',
                  '.screen-stage{width:220px}.screen-box{transform:scale(.75);transform-origin:center}'
              ),
          ]

          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Expected CSS fragment not found: {old}')
              s = s.replace(old, new, 1)

          path.write_text(s, encoding='utf-8')

          # One-time workflow: remove itself after applying the patch.
          Path('.github/workflows/fix-all-screen-scale.yml').unlink()
      - name: Commit proportional scale fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-all-screen-scale.yml
          git commit -m "Scale all LED screen formats proportionally"
          git push