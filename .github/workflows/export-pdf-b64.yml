name: Export PDFs for blanking

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  export:
    if: github.event.head_commit.message == 'Re-export wrapped PDFs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Encode source PDFs
        run: |
          mkdir -p .tmp_pdf
          for f in downloads/LED-Trailer_Datenblatt_28m2.pdf downloads/LED-Trailer_Datenblatt_91m2.pdf downloads/LED-Trailer_Datenblatt_117m2.pdf downloads/LED-Trailer_Datenblatt_144m2.pdf; do
            base64 -w 3000 "$f" > ".tmp_pdf/$(basename "$f").b64"
          done
      - name: Commit encoded files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .tmp_pdf
          git commit -m "Temporary wrapped PDF base64 export"
          git push
