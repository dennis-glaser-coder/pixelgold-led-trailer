name: CTA patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'Smart mobile CTA'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sed -i 's/.mobile-cta{display:flex;position:fixed;left:12px;right:12px;bottom:12px;z-index:40;box-shadow:0 8px 24px rgba(0,0,0,.28)}/.mobile-cta{display:flex;position:fixed;left:12px;right:12px;bottom:12px;z-index:40;box-shadow:0 8px 24px rgba(0,0,0,.28);opacity:0;visibility:hidden;transform:translateY(12px);pointer-events:none}.mobile-cta.is-visible{opacity:1;visibility:visible;transform:translateY(0);pointer-events:auto}/' index.html
          sed -i "/const menu=/i const mobileCta=document.querySelector('.mobile-cta'),hero=document.querySelector('.hero'),contactSection=document.querySelector('#kontakt');let heroVisible=true,contactVisible=false;function updateMobileCta(){if(mobileCta)mobileCta.classList.toggle('is-visible',!heroVisible&&!contactVisible&&window.innerWidth<=820)}if(mobileCta&&hero&&contactSection){new IntersectionObserver(e=>{heroVisible=e[0].isIntersecting;updateMobileCta()},{threshold:.01}).observe(hero);new IntersectionObserver(e=>{contactVisible=e[0].isIntersecting;updateMobileCta()},{threshold:.05}).observe(contactSection);window.addEventListener('resize',updateMobileCta,{passive:true});updateMobileCta();}" index.html
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m 'Smart mobile CTA' || exit 0
          git push
