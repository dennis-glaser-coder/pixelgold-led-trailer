name: Add 28 m2 datasheet once

on:
  push:
    paths:
      - '.github/workflows/add-28-datasheet-once.yml'

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-core fonts-roboto
          python -m pip install --quiet reportlab
      - name: Create 28 m2 PDF and add website links
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          from reportlab.pdfgen import canvas
          from reportlab.lib.pagesizes import A4
          from reportlab.lib.colors import HexColor
          from reportlab.pdfbase import pdfmetrics
          from reportlab.pdfbase.ttfonts import TTFont
          from reportlab.lib.units import mm

          out = Path('downloads/LED-Trailer_Datenblatt_28m2.pdf')
          out.parent.mkdir(parents=True, exist_ok=True)

          fonts = {
              'Sans': '/usr/share/fonts/truetype/noto/NotoSans-Regular.ttf',
              'SansBold': '/usr/share/fonts/truetype/noto/NotoSans-Bold.ttf',
              'Cond': '/usr/share/fonts/truetype/roboto/unhinted/RobotoCondensed-Regular.ttf',
          }
          for name, path in fonts.items():
              if not Path(path).exists():
                  raise SystemExit(f'Missing required font: {name} at {path}')
              pdfmetrics.registerFont(TTFont(name, path))
          med = '/usr/share/fonts/truetype/noto/NotoSans-Medium.ttf'
          if not Path(med).exists(): med = fonts['Sans']
          pdfmetrics.registerFont(TTFont('SansMed', med))

          W, H = A4
          BLACK=HexColor('#090B0C'); DARK=HexColor('#131719'); TEXT=HexColor('#15191B')
          MUTED=HexColor('#6B7377'); LIGHT=HexColor('#F2F3F1'); WHITE=HexColor('#FFFFFF')
          LINE=HexColor('#D7DBDC'); YELLOW=HexColor('#F7CA02')
          M=16*mm; CONTENT_W=W-2*M

          def t(c,x,y,s,font='Sans',size=9,color=TEXT): c.setFillColor(color); c.setFont(font,size); c.drawString(x,y,s)
          def tr(c,x,y,s,font='Sans',size=9,color=TEXT): c.setFillColor(color); c.setFont(font,size); c.drawRightString(x,y,s)
          def tc(c,x,y,s,font='Sans',size=9,color=TEXT): c.setFillColor(color); c.setFont(font,size); c.drawCentredString(x,y,s)
          def hline(c,x1,y,x2,color=LINE,width=.6): c.setStrokeColor(color); c.setLineWidth(width); c.line(x1,y,x2,y)
          def section_title(c,x,y,title):
              c.setFillColor(YELLOW); c.rect(x,y-2,18,2.2,fill=1,stroke=0); t(c,x+24,y-4,title.upper(),'SansBold',8.4,TEXT)
          def spec_row(c,x,y,w,label,value,label_w=52*mm,row_h=9.2*mm):
              hline(c,x,y,x+w,LINE,.5); t(c,x,y-row_h+3.1*mm,label.upper(),'SansMed',6.7,MUTED); t(c,x+label_w,y-row_h+3.0*mm,value,'SansMed',9.1,TEXT); return y-row_h
          def footer(c,n):
              hline(c,M,14*mm,W-M,LINE,.5); t(c,M,8.5*mm,'LED-Trailer.com','SansBold',7.2,TEXT); tc(c,W/2,8.5*mm,'Technisches Datenblatt · 28 m²','Sans',7,MUTED); tr(c,W-M,8.5*mm,f'{n}/2','Sans',7,MUTED)
          def dim_h(c,x1,x2,y,label):
              c.setStrokeColor(MUTED); c.setLineWidth(.65); c.line(x1,y,x2,y); a=3
              c.line(x1,y,x1+a,y+a/1.7); c.line(x1,y,x1+a,y-a/1.7); c.line(x2,y,x2-a,y+a/1.7); c.line(x2,y,x2-a,y-a/1.7); tc(c,(x1+x2)/2,y+4.0,label,'SansMed',7.5,MUTED)
          def dim_v(c,x,y1,y2,label):
              c.setStrokeColor(MUTED); c.setLineWidth(.65); c.line(x,y1,x,y2); a=3
              c.line(x,y1,x+a/1.7,y1+a); c.line(x,y1,x-a/1.7,y1+a); c.line(x,y2,x+a/1.7,y2-a); c.line(x,y2,x-a/1.7,y2-a)
              c.saveState(); c.translate(x+7,(y1+y2)/2); c.rotate(90); tc(c,0,0,label,'SansMed',7.5,MUTED); c.restoreState()

          c=canvas.Canvas(str(out),pagesize=A4)
          c.setFillColor(WHITE); c.rect(0,0,W,H,fill=1,stroke=0)
          c.setFillColor(BLACK); c.rect(0,H-24*mm,W,24*mm,fill=1,stroke=0)
          t(c,M,H-15.5*mm,'LED-TRAILER.COM','Cond',17,WHITE); tr(c,W-M,H-15.2*mm,'TECHNISCHES DATENBLATT','SansBold',7.5,YELLOW)
          hero_top=H-24*mm; hero_h=55*mm
          c.setFillColor(DARK); c.rect(0,hero_top-hero_h,W,hero_h,fill=1,stroke=0)
          t(c,M,hero_top-13*mm,'MOBILER LED-TRAILER','SansBold',8,YELLOW); t(c,M,hero_top-33*mm,'28 m²','SansBold',36,WHITE); t(c,M,hero_top-45*mm,'7,00 x 4,00 m Bildfläche','SansMed',12.5,WHITE)
          rx=W-64*mm
          t(c,rx,hero_top-15*mm,'PIXELPITCH','SansBold',6.5,HexColor('#AAB0B2')); t(c,rx,hero_top-23*mm,'P8 / 8,3 mm','SansMed',11.5,WHITE)
          t(c,rx,hero_top-34*mm,'AUFLÖSUNG','SansBold',6.5,HexColor('#AAB0B2')); t(c,rx,hero_top-42*mm,'840 x 480 Pixel','SansMed',11.5,WHITE)
          y=hero_top-hero_h-13*mm; section_title(c,M,y,'LED-Bildfläche'); y-=8*mm
          for a,b in [('Bildfläche','28 m²'),('Bildmaß','7,00 x 4,00 m'),('Pixelpitch','P8 / 8,3 mm'),('Auflösung','840 x 480 Pixel · 403.200 Pixel gesamt'),('Helligkeit','5.500 cd/m²'),('Betrachtungswinkel','140°')]: y=spec_row(c,M,y,CONTENT_W,a,b)
          y-=9*mm; section_title(c,M,y,'Mechanik & Abmessungen'); y-=8*mm
          for a,b in [('Drehbereich','360° drehbar'),('Oberkante Bildfläche','variabel von 4,80 bis 7,10 m'),('Unterkante Bildfläche','variabel von 0,80 bis 3,10 m'),('Grundfläche','ca. 9,0 x 3,80 m'),('Aufbaubereich um Mast','ca. Ø 7,50 m'),('Transportgewicht','3.500 kg')]: y=spec_row(c,M,y,CONTENT_W,a,b)
          y-=9*mm; section_title(c,M,y,'Betrieb'); y-=8*mm
          for a,b in [('Aufbauzeit','ca. 60 Minuten'),('Abbauzeit','ca. 45 Minuten'),('Stromversorgung','32 A / 400 V / 3 Ph + N + PE')]: y=spec_row(c,M,y,CONTENT_W,a,b,row_h=9.3*mm)
          footer(c,1); c.showPage()

          c.setFillColor(WHITE); c.rect(0,0,W,H,fill=1,stroke=0)
          c.setFillColor(BLACK); c.rect(0,H-24*mm,W,24*mm,fill=1,stroke=0)
          t(c,M,H-15.5*mm,'LED-TRAILER.COM','Cond',17,WHITE); tr(c,W-M,H-15.2*mm,'ABMESSUNGEN & PLANUNG','SansBold',7.5,YELLOW)
          t(c,M,H-44*mm,'Abmessungen & Planung','Cond',25,TEXT); t(c,M,H-55*mm,'Technische Eckdaten für Aufbau, Positionierung und Versorgung.','Sans',9.4,MUTED)
          top=H-72*mm; panel_h=68*mm; panel_bottom=top-panel_h
          c.setStrokeColor(LINE); c.setLineWidth(.7); c.rect(M,panel_bottom,CONTENT_W,panel_h,fill=0,stroke=1); t(c,M+7*mm,top-9*mm,'BILDFLÄCHE / VORDERANSICHT','SansBold',7.3,MUTED)
          cx=W/2; screen_w=92*mm; screen_h=screen_w*(4/7); sx=cx-screen_w/2; sy=panel_bottom+10*mm
          c.setStrokeColor(TEXT); c.setLineWidth(1.2); c.rect(sx,sy,screen_w,screen_h,fill=0,stroke=1)
          dim_h(c,sx,sx+screen_w,sy+screen_h+4.5*mm,'7,00 m'); dim_v(c,sx+screen_w+8*mm,sy,sy+screen_h,'4,00 m')
          y2=panel_bottom-14*mm; section_title(c,M,y2,'Planungsdaten'); y2-=8*mm
          for a,b in [('Grundfläche','ca. 9,0 x 3,80 m'),('Aufbaubereich um Mast','ca. Ø 7,50 m'),('Drehbereich','360° drehbar'),('Oberkante Bildfläche','variabel von 4,80 bis 7,10 m'),('Unterkante Bildfläche','variabel von 0,80 bis 3,10 m'),('Transportgewicht','3.500 kg'),('Aufbauzeit','ca. 60 Minuten'),('Abbauzeit','ca. 45 Minuten')]: y2=spec_row(c,M,y2,CONTENT_W,a,b,row_h=8.1*mm)
          section_title(c,M,51*mm,'Stromversorgung'); block_y=27*mm; block_h=25*mm
          c.setFillColor(LIGHT); c.rect(M,block_y,CONTENT_W,block_h,fill=1,stroke=0)
          t(c,M+7*mm,block_y+17*mm,'ANSCHLUSS','SansBold',6.7,MUTED); t(c,M+7*mm,block_y+8.5*mm,'32 A / 400 V','SansBold',12.2,TEXT); t(c,M+7*mm,block_y+3.5*mm,'3 Ph + N + PE','Sans',7.4,MUTED)
          t(c,M,20.5*mm,'Hinweis: Prinzipdarstellung, nicht maßstabsgetreu. Detaillierte technische Zeichnungen auf Anfrage.','Sans',7.0,MUTED)
          footer(c,2); c.save()

          index_path=Path('index.html'); html=index_path.read_text(encoding='utf-8')
          m=re.search(r'<article class="product" data-size="28 m²">.*?</article>',html,re.S)
          if not m: raise SystemExit('28 m² product block not found')
          block=m.group(0)
          if 'LED-Trailer_Datenblatt_28m2.pdf' not in block:
              old='<p class="detail-copy">Auflösung, Ausfahrhöhe, Drehbereich und Datenblatt werden hier ergänzt.</p></div><a class="button product-cta" href="#kontakt">28 m² Trailer anfragen</a>'
              new='<p class="detail-copy">7,00 × 4,00 m Bildfläche · P8 / 8,3 mm · 840 × 480 Pixel · 360° drehbar. Das vollständige technische Datenblatt steht als PDF bereit.</p></div><div style="display:flex;gap:10px;flex-wrap:wrap"><a class="button product-cta" href="./downloads/LED-Trailer_Datenblatt_28m2.pdf" target="_blank" rel="noopener">Datenblatt (PDF)</a><a class="button product-cta" href="#kontakt">28 m² Trailer anfragen</a></div>'
              if old not in block: raise SystemExit('Expected 28 m² details content not found')
              html=html[:m.start()]+block.replace(old,new,1)+html[m.end():]
              index_path.write_text(html,encoding='utf-8')

          dp=Path('downloads.html'); d=dp.read_text(encoding='utf-8')
          if 'LED-Trailer_Datenblatt_28m2.pdf' not in d:
              row91='<div class="download-row"><div class="size">91 m²</div><div class="meta"><strong>LED-Trailer 13,00 × 7,00 m</strong><span>P4 / 4,8 mm · 2.704 × 1.456 Pixel · PDF, 2 Seiten</span></div><a class="button pdf" href="./downloads/LED-Trailer_Datenblatt_91m2.pdf" download>PDF herunterladen</a></div>'
              row28='<div class="download-row"><div class="size">28 m²</div><div class="meta"><strong>LED-Trailer 7,00 × 4,00 m</strong><span>P8 / 8,3 mm · 840 × 480 Pixel · PDF, 2 Seiten</span></div><a class="button pdf" href="./downloads/LED-Trailer_Datenblatt_28m2.pdf" download>PDF herunterladen</a></div>'
              if row91 not in d: raise SystemExit('Existing 91 m² download row not found')
              d=d.replace(row91,row91+row28,1)
              dp.write_text(d,encoding='utf-8')
          PY
      - name: Commit scoped changes and remove one-time workflow
        run: |
          rm .github/workflows/add-28-datasheet-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html downloads.html downloads/LED-Trailer_Datenblatt_28m2.pdf .github/workflows/add-28-datasheet-once.yml
          git commit -m "Add 28 m² datasheet and links"
          git push
