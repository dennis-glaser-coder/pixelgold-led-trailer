name: Build hero assets

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create responsive hero package
        run: |
          python -m pip install pillow
          python - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path

          src = ImageOps.exif_transpose(Image.open('Trailerbild 1.png')).convert('RGB')
          for name, width, quality in [
              ('Trailerbild-hero-960.webp', 960, 82),
              ('Trailerbild-hero-1600.webp', 1600, 84),
          ]:
              im = src.copy()
              if im.width > width:
                  h = round(im.height * width / im.width)
                  im = im.resize((width, h), Image.Resampling.LANCZOS)
              im.save(name, 'WEBP', quality=quality, method=6)
              print(name, im.size, Path(name).stat().st_size)

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<section class="hero" aria-labelledby="hero-title"><img class="hero-bg" src="./Trailerbild%201.png" alt="Großer LED-Screen im Einsatz bei einer Veranstaltung" fetchpriority="high">'
          new = '<section class="hero" aria-labelledby="hero-title"><picture><source media="(max-width:820px)" srcset="./Trailerbild-hero-960.webp" type="image/webp"><source srcset="./Trailerbild-hero-1600.webp" type="image/webp"><img class="hero-bg" src="./Trailerbild%201.png" alt="Großer LED-Screen im Einsatz bei einer Veranstaltung" fetchpriority="high" decoding="async"></picture>'
          if old not in s:
              raise SystemExit('Hero image marker not found')
          s = s.replace(old, new, 1)
          s = s.replace('<img src="./Trailerbild%201.png" loading="lazy" alt="LED-Screen bei einer Veranstaltung">', '<img src="./Trailerbild-hero-1600.webp" loading="lazy" decoding="async" alt="LED-Screen bei einer Veranstaltung">', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hero-package
          path: |
            index.html
            Trailerbild-hero-960.webp
            Trailerbild-hero-1600.webp
          retention-days: 1
