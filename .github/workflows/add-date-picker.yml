name: Repair date picker submit handler

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Repair date picker submit handler'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair submit handler safely
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          start=s.index("inquiryForm.addEventListener('submit',e=>{")
          end=s.index('\n</script>',start)
          new_submit="""inquiryForm.addEventListener('submit',e=>{e.preventDefault();const place=document.querySelector('#place'),startDate=document.querySelector('#start-date'),endDate=document.querySelector('#end-date');if(!place.reportValidity()||!startDate.reportValidity())return;if(endDate.value&&endDate.value<startDate.value){endDate.setCustomValidity('Das Enddatum darf nicht vor dem Startdatum liegen.');endDate.reportValidity();return}else endDate.setCustomValidity('');saveDraft();const f=new FormData(inquiryForm);const formatDate=value=>{if(!value)return'';const [y,m,d]=value.split('-');return d+'.'+m+'.'+y};const startText=formatDate(f.get('startDate')),endText=formatDate(f.get('endDate'));const periodText=endText&&endText!==startText?startText+' – '+endText:startText;const body=['Guten Tag,','','ich möchte einen LED-Trailer anfragen.','','Firma: '+f.get('company'),'Ansprechpartner: '+f.get('contactName'),'E-Mail: '+f.get('email'),'Telefon: '+f.get('phone'),'Veranstaltungsort: '+f.get('place'),'Datum / Zeitraum: '+periodText,'Bildfläche: '+(selectedSize||'nicht ausgewählt')].join(String.fromCharCode(10));window.location.href='mailto:kontakt@pixelgold.de?subject='+encodeURIComponent('LED-Trailer Anfrage · '+periodText)+'&body='+encodeURIComponent(body)});"""
          s=s[:start]+new_submit+s[end:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Repair date picker submit handler safely"
          git push
