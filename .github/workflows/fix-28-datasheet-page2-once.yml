name: Fix 28 m2 datasheet page 2 once

on:
  push:
    paths:
      - '.github/workflows/fix-28-datasheet-page2-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-core fonts-roboto
          python -m pip install --quiet reportlab pypdf
      - name: Rebuild corrected page 2 and keep page 1 unchanged
        run: |
          python - <<'PY'
          from pathlib import Path
          from reportlab.pdfgen import canvas
          from reportlab.lib.pagesizes import A4
          from reportlab.lib.colors import HexColor
          from reportlab.pdfbase import pdfmetrics
          from reportlab.pdfbase.ttfonts import TTFont
          from reportlab.lib.units import mm
          from pypdf import PdfReader, PdfWriter

          src = Path('downloads/LED-Trailer_Datenblatt_28m2.pdf')
          tmp_page2 = Path('/tmp/28-page2.pdf')
          tmp_out = Path('/tmp/28-fixed.pdf')

          fonts = {
              'Sans': '/usr/share/fonts/truetype/noto/NotoSans-Regular.ttf',
              'SansBold': '/usr/share/fonts/truetype/noto/NotoSans-Bold.ttf',
              'Cond': '/usr/share/fonts/truetype/roboto/unhinted/RobotoCondensed-Regular.ttf',
          }
          for name, path in fonts.items():
              if not Path(path).exists():
                  raise SystemExit(f'Missing required font: {name} at {path}')
              pdfmetrics.registerFont(TTFont(name, path))
          med = '/usr/share/fonts/truetype/noto/NotoSans-Medium.ttf'
          if not Path(med).exists(): med = fonts['Sans']
          pdfmetrics.registerFont(TTFont('SansMed', med))

          W, H = A4
          BLACK=HexColor('#090B0C'); TEXT=HexColor('#15191B'); MUTED=HexColor('#6B7377')
          LIGHT=HexColor('#F2F3F1'); WHITE=HexColor('#FFFFFF'); LINE=HexColor('#D7DBDC'); YELLOW=HexColor('#F7CA02')
          M=16*mm; CONTENT_W=W-2*M

          def t(c,x,y,s,font='Sans',size=9,color=TEXT): c.setFillColor(color); c.setFont(font,size); c.drawString(x,y,s)
          def tr(c,x,y,s,font='Sans',size=9,color=TEXT): c.setFillColor(color); c.setFont(font,size); c.drawRightString(x,y,s)
          def tc(c,x,y,s,font='Sans',size=9,color=TEXT): c.setFillColor(color); c.setFont(font,size); c.drawCentredString(x,y,s)
          def hline(c,x1,y,x2,color=LINE,width=.6): c.setStrokeColor(color); c.setLineWidth(width); c.line(x1,y,x2,y)
          def section_title(c,x,y,title):
              c.setFillColor(YELLOW); c.rect(x,y-2,18,2.2,fill=1,stroke=0); t(c,x+24,y-4,title.upper(),'SansBold',8.4,TEXT)
          def spec_row(c,x,y,w,label,value,label_w=52*mm,row_h=8.1*mm):
              hline(c,x,y,x+w,LINE,.5); t(c,x,y-row_h+3.1*mm,label.upper(),'SansMed',6.7,MUTED); t(c,x+label_w,y-row_h+3.0*mm,value,'SansMed',9.1,TEXT); return y-row_h
          def footer(c,n):
              hline(c,M,14*mm,W-M,LINE,.5); t(c,M,8.5*mm,'LED-Trailer.com','SansBold',7.2,TEXT); tc(c,W/2,8.5*mm,'Technisches Datenblatt · 28 m²','Sans',7,MUTED); tr(c,W-M,8.5*mm,f'{n}/2','Sans',7,MUTED)
          def dim_h(c,x1,x2,y,label):
              c.setStrokeColor(MUTED); c.setLineWidth(.65); c.line(x1,y,x2,y); a=3
              c.line(x1,y,x1+a,y+a/1.7); c.line(x1,y,x1+a,y-a/1.7); c.line(x2,y,x2-a,y+a/1.7); c.line(x2,y,x2-a,y-a/1.7); tc(c,(x1+x2)/2,y+4.0,label,'SansMed',7.5,MUTED)
          def dim_v(c,x,y1,y2,label):
              c.setStrokeColor(MUTED); c.setLineWidth(.65); c.line(x,y1,x,y2); a=3
              c.line(x,y1,x+a/1.7,y1+a); c.line(x,y1,x-a/1.7,y1+a); c.line(x,y2,x+a/1.7,y2-a); c.line(x,y2,x-a/1.7,y2-a)
              c.saveState(); c.translate(x+7,(y1+y2)/2); c.rotate(90); tc(c,0,0,label,'SansMed',7.5,MUTED); c.restoreState()

          c=canvas.Canvas(str(tmp_page2),pagesize=A4)
          c.setFillColor(WHITE); c.rect(0,0,W,H,fill=1,stroke=0)
          c.setFillColor(BLACK); c.rect(0,H-24*mm,W,24*mm,fill=1,stroke=0)
          t(c,M,H-15.5*mm,'LED-TRAILER.COM','Cond',17,WHITE)
          tr(c,W-M,H-15.2*mm,'ABMESSUNGEN & PLANUNG','SansBold',7.5,YELLOW)
          t(c,M,H-44*mm,'Abmessungen & Planung','Cond',25,TEXT)
          t(c,M,H-55*mm,'Technische Eckdaten für Aufbau, Positionierung und Versorgung.','Sans',9.4,MUTED)

          top=H-72*mm; panel_h=68*mm; panel_bottom=top-panel_h
          c.setStrokeColor(LINE); c.setLineWidth(.7); c.rect(M,panel_bottom,CONTENT_W,panel_h,fill=0,stroke=1)
          t(c,M+7*mm,top-9*mm,'BILDFLÄCHE / VORDERANSICHT','SansBold',7.3,MUTED)
          cx=W/2; screen_w=92*mm; screen_h=screen_w*(4/7); sx=cx-screen_w/2
          # Screen deliberately lower than before so the label has clear separation.
          sy=panel_bottom+3*mm
          c.setStrokeColor(TEXT); c.setLineWidth(1.2); c.rect(sx,sy,screen_w,screen_h,fill=0,stroke=1)
          dim_h(c,sx,sx+screen_w,sy+screen_h+4.5*mm,'7,00 m')
          dim_v(c,sx+screen_w+8*mm,sy,sy+screen_h,'4,00 m')

          y2=panel_bottom-14*mm; section_title(c,M,y2,'Planungsdaten'); y2-=8*mm
          for a,b in [
              ('Grundfläche','ca. 9,0 x 3,80 m'),
              ('Aufbaubereich um Mast','ca. Ø 7,50 m'),
              ('Drehbereich','360° drehbar'),
              ('Oberkante Bildfläche','variabel von 4,80 bis 7,10 m'),
              ('Unterkante Bildfläche','variabel von 0,80 bis 3,10 m'),
              ('Transportgewicht','3.500 kg'),
              ('Aufbauzeit','ca. 60 Minuten'),
              ('Abbauzeit','ca. 45 Minuten')
          ]:
              y2=spec_row(c,M,y2,CONTENT_W,a,b,row_h=8.1*mm)

          # Keep heading clearly above the connection box; previously the box covered it.
          section_title(c,M,61*mm,'Stromversorgung')
          block_y=27*mm; block_h=25*mm
          c.setFillColor(LIGHT); c.rect(M,block_y,CONTENT_W,block_h,fill=1,stroke=0)
          t(c,M+7*mm,block_y+17*mm,'ANSCHLUSS','SansBold',6.7,MUTED)
          t(c,M+7*mm,block_y+8.5*mm,'32 A / 400 V','SansBold',12.2,TEXT)
          t(c,M+7*mm,block_y+3.5*mm,'3 Ph + N + PE','Sans',7.4,MUTED)
          t(c,M,20.5*mm,'Hinweis: Prinzipdarstellung, nicht maßstabsgetreu. Detaillierte technische Zeichnungen auf Anfrage.','Sans',7.0,MUTED)
          footer(c,2)
          c.save()

          old = PdfReader(str(src))
          new2 = PdfReader(str(tmp_page2))
          if len(old.pages) < 1 or len(new2.pages) != 1:
              raise SystemExit('Unexpected PDF page count')
          writer = PdfWriter()
          writer.add_page(old.pages[0])
          writer.add_page(new2.pages[0])
          with tmp_out.open('wb') as f:
              writer.write(f)
          src.write_bytes(tmp_out.read_bytes())
          PY
      - name: Commit corrected PDF and remove one-time workflow
        run: |
          rm .github/workflows/fix-28-datasheet-page2-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/LED-Trailer_Datenblatt_28m2.pdf .github/workflows/fix-28-datasheet-page2-once.yml
          git commit -m "Fix 28 m² datasheet page 2 layout"
          git push
