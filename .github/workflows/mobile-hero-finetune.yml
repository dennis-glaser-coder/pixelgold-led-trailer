name: Hero spacing updater
on: [push]
permissions:
  contents: write
jobs:
  update:
    if: github.event.head_commit.message == 'Add temporary hero spacing updater'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(); s=s.replace('.hero{height:auto;min-height:720px}.hero-bg{object-position:62% 35%}.hero-shade','.hero{height:auto;min-height:660px}.hero-bg{object-position:56% 35%}.hero-shade').replace('.hero-inner{padding:145px 0 180px}','.hero-inner{padding:105px 0 160px}').replace('@media(max-width:520px){.hero{min-height:680px}.hero-inner{padding-top:132px}','@media(max-width:520px){.hero{min-height:620px}.hero-inner{padding-top:92px;padding-bottom:150px}'); p.write_text(s)"
          git config user.name dennis-glaser-coder
          git config user.email dennis-glaser@gmx.de
          git add index.html
          git commit -m 'Fine tune mobile hero spacing and crop'
          git push
