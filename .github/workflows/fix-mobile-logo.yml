name: Fix mobile logo

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Use PNG header logo'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch logo reference
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = './led-trailer-logo-header.svg?v=3'
          new = './led-trailer-logo-header.png?v=4'
          if old in s:
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit change
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use PNG header logo"
          git push
