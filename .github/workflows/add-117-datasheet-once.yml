name: Finish 117 m2 datasheet links

on:
  push:
    paths:
      - '.github/workflows/add-117-datasheet-once.yml'

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add only 117 m2 links
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          index_path = Path('index.html')
          html = index_path.read_text(encoding='utf-8')
          m = re.search(r'<article class="product" data-size="117 m²">.*?</article>', html, re.S)
          if not m:
              raise SystemExit('117 m² product block not found')
          block = m.group(0)
          if 'LED-Trailer_Datenblatt_117m2.pdf' not in block:
              old = '<p class="detail-copy">Auflösung, Ausfahrhöhe, Drehbereich und Datenblatt werden hier ergänzt.</p></div><a class="button product-cta" href="#kontakt">117 m² Trailer anfragen</a>'
              new = '<p class="detail-copy">13,00 × 9,00 m Bildfläche · P4 / 4,8 mm · 2.704 × 1.872 Pixel · 360° drehbar. Das vollständige technische Datenblatt steht als PDF bereit.</p></div><div style="display:flex;gap:10px;flex-wrap:wrap"><a class="button product-cta" href="./downloads/LED-Trailer_Datenblatt_117m2.pdf" target="_blank" rel="noopener">Datenblatt (PDF)</a><a class="button product-cta" href="#kontakt">117 m² Trailer anfragen</a></div>'
              if old not in block:
                  raise SystemExit('Expected 117 m² details content not found')
              html = html[:m.start()] + block.replace(old, new, 1) + html[m.end():]
              index_path.write_text(html, encoding='utf-8')

          downloads_path = Path('downloads.html')
          d = downloads_path.read_text(encoding='utf-8')
          if 'LED-Trailer_Datenblatt_117m2.pdf' not in d:
              row144 = '<div class="download-row"><div class="size">144 m²</div><div class="meta"><strong>LED-Trailer 16,00 × 9,00 m</strong><span>P4 / 4,8 mm · 3.328 × 1.872 Pixel · PDF, 2 Seiten</span></div><a class="button pdf" href="./downloads/LED-Trailer_Datenblatt_144m2.pdf" download>PDF herunterladen</a></div>'
              row117 = '<div class="download-row"><div class="size">117 m²</div><div class="meta"><strong>LED-Trailer 13,00 × 9,00 m</strong><span>P4 / 4,8 mm · 2.704 × 1.872 Pixel · PDF, 2 Seiten</span></div><a class="button pdf" href="./downloads/LED-Trailer_Datenblatt_117m2.pdf" download>PDF herunterladen</a></div>'
              if row144 not in d:
                  raise SystemExit('Existing 144 m² download row not found')
              d = d.replace(row144, row144 + row117, 1)
              downloads_path.write_text(d, encoding='utf-8')
          PY
      - name: Commit scoped changes and remove one-time workflow
        run: |
          rm .github/workflows/add-117-datasheet-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html downloads.html .github/workflows/add-117-datasheet-once.yml
          git commit -m "Link 117 m² datasheet"
          git push
