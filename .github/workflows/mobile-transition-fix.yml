name: Mobile transition fix
on: [push]
permissions:
  contents: write
jobs:
  update:
    if: github.event.head_commit.message == 'Add temporary mobile transition fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('.gallery-copy{padding:58px 18px 68px}.gallery-copy h2{font-size:56px}', '.gallery-copy{padding:58px 18px 28px}.gallery-copy .text-link{display:none}.gallery-copy h2{font-size:56px}', 1)
          s=s.replace('.contact-grid{grid-template-columns:1fr;gap:46px}.contact h2{font-size:59px}', '.contact{padding-top:42px}.contact-grid{grid-template-columns:1fr;gap:28px}.contact h2{font-size:52px}', 1)
          s=s.replace('@media(max-width:520px){.hero{min-height:620px}.hero-inner{padding-top:92px;padding-bottom:150px}', '@media(max-width:520px){.hero{min-height:620px}.hero-inner{padding-top:92px;padding-bottom:150px}.gallery-copy{padding-bottom:22px}.contact{padding-top:34px}.contact h2{font-size:48px}', 1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name dennis-glaser-coder
          git config user.email dennis-glaser@gmx.de
          git add index.html
          git commit -m 'Tighten mobile transition into contact section'
          git push
