name: Site sanity fixes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Apply site sanity fixes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply safe fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<meta name="robots" content="noindex,nofollow">', '<meta name="robots" content="index,follow">', 1)
          if '<link rel="canonical"' not in s:
              marker = '<meta name="description" content="Mobile LED-Screens von 7 bis 144 m² für Public Viewing, Events, Firmenveranstaltungen und Promotion.">'
              s = s.replace(marker, marker + '\n<link rel="canonical" href="https://led-trailer.com/">', 1)
          s = s.replace('<div class="footer-brand">LED TRAILER</div>', '<div class="footer-brand">LED-Trailer.com</div>', 1)
          if "history.scrollRestoration='manual'" not in s:
              s = s.replace('<script>\n', "<script>\nif('scrollRestoration' in history)history.scrollRestoration='manual';\nwindow.addEventListener('pageshow',()=>{const n=performance.getEntriesByType&&performance.getEntriesByType('navigation')[0];if(!n||n.type==='reload'){const h=document.documentElement.style.scrollBehavior;document.documentElement.style.scrollBehavior='auto';window.scrollTo(0,0);requestAnimationFrame(()=>{document.documentElement.style.scrollBehavior=h})}});\n", 1)
          p.write_text(s, encoding='utf-8')

          for fn, old_title, new_title in [
              ('impressum.html', 'Impressum · LED Trailer', 'Impressum · LED-Trailer.com'),
              ('datenschutz.html', 'Datenschutz · LED Trailer', 'Datenschutz · LED-Trailer.com'),
          ]:
              q = Path(fn)
              t = q.read_text(encoding='utf-8')
              t = t.replace(old_title, new_title)
              t = t.replace('>LED TRAILER<', '>LED-Trailer.com<')
              t = t.replace('LED TRAILER · by pixelgold', 'LED-Trailer.com · by pixelgold')
              q.write_text(t, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html impressum.html datenschutz.html
          git commit -m "Apply site sanity fixes"
          git push
