name: Remove screen hook

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-screen-hook.yml'

permissions:
  contents: write

jobs:
  remove-hook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove decorative hook from LED screen graphic
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          s = path.read_text(encoding='utf-8')
          old = '.screen-box:after{content:"";position:absolute;right:-24px;bottom:-28px;width:12px;height:16px;border-left:2px solid #111619;border-bottom:2px solid #111619}'
          if old not in s:
              raise SystemExit('Expected hook CSS fragment not found')
          s = s.replace(old, '', 1)
          path.write_text(s, encoding='utf-8')

          Path('.github/workflows/remove-screen-hook.yml').unlink()
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/remove-screen-hook.yml
          git commit -m "Remove decorative hook from LED screen graphic"
          git push