name: Fix 144 details once
on:
  push:
    paths:
      - '.github/workflows/fix-144-details-once.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix only 144 m2 details label
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<span class="product-more"><span Details</span><span class="chevron" aria-hidden="true"></span></span>'
          new = '<span class="product-more"><span>Details</span><span class="chevron" aria-hidden="true"></span></span>'
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one broken 144 details label, found {count}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit fix and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-144-details-once.yml
          git add index.html
          git commit -m 'Fix 144 m² details label'
          git push
