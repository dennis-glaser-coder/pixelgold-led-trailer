name: Use text brand

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Use text header brand'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace image logo with text
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<a href="./" class="brand" aria-label="LED-Trailer.com Startseite"><img src="./led-trailer-logo-header.png?v=4" alt="LED-Trailer.com" width="210" height="49" style="display:block;height:auto;max-height:49px"></a>'
          new = '<a href="./" class="brand" aria-label="LED-Trailer.com Startseite">LED-Trailer.com</a>'
          if old in s:
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit change
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use text header brand"
          git push
