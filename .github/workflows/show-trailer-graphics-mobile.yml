name: Show trailer graphics on mobile

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable proportional trailer graphics on mobile
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '.visual-wrap{grid-column:1/-1;display:block;margin-top:18px}.screen-stage{display:none}.product-data'
          new = '.visual-wrap{grid-column:1/-1;display:grid;grid-template-columns:1fr;gap:18px;margin-top:18px}.screen-stage{display:flex;width:100%;height:168px;justify-content:center;overflow:visible}.product-data'
          if old not in s:
              raise SystemExit('Target mobile CSS not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Show LED trailer graphics on mobile"
          git push
